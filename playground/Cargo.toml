[package]
name = "playground"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pest = "2.8.6"
melior = "0.27.0"
parser = { path = "../parser" }
lower = { path = "../lower" }
